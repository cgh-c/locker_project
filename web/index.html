<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能储物柜控制面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f5f7fb;
            padding: 16px 12px 30px;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #e8ecf1;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1a2a3a;
        }
        .status-badge {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #e9ecef;
            color: #495057;
        }
        .status-badge.online {
            background: #d4edda;
            color: #155724;
        }
        .status-badge.offline {
            background: #f8d7da;
            color: #721c24;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 8px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 14px 8px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.2s;
            border: 1px solid #eaedf2;
        }
        .card .id {
            font-size: 13px;
            color: #6c7a8a;
            font-weight: 500;
            background: #f1f3f5;
            padding: 0 8px;
            border-radius: 10px;
            line-height: 20px;
            margin-bottom: 6px;
        }
        .card .state {
            font-size: 14px;
            font-weight: 600;
            margin: 4px 0 8px;
            padding: 2px 12px;
            border-radius: 12px;
            background: #f1f3f5;
            color: #495057;
        }
        .card .state.open {
            color: #28a745;
            background: #d4edda;
        }
        .card .state.closed {
            color: #dc3545;
            background: #f8d7da;
        }
        .card .state.unknown {
            color: #6c757d;
            background: #e9ecef;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            background: #e9ecef;
            color: #495057;
            flex: 1;
            min-width: 44px;
            text-align: center;
        }
        .btn-open {
            background: #007bff;
            color: white;
        }
        .btn-open:active {
            background: #0056b3;
        }
        .btn-refresh {
            background: #6c757d;
            color: white;
        }
        .btn-refresh:active {
            background: #5a6268;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #adb5bd;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        .loading-mask {
            text-align: center;
            padding: 40px 0;
            color: #6c757d;
            font-size: 14px;
        }
        @media (max-width: 380px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📦 智能储物柜</h1>
    <span id="connStatus" class="status-badge">连接中...</span>
</div>

<div id="gridContainer" class="grid"></div>

<div class="footer">
    设备 ID: locker001 &nbsp;|&nbsp; MQTT over WebSocket
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>

<script>
    // ========== 配置 ==========
    const BROKER_HOST = MQTT_CONFIG.broker;
    const WS_PORT = MQTT_CONFIG.port;            // WSS 端口
    const USERNAME = MQTT_CONFIG.username;
    const PASSWORD = MQTT_CONFIG.password;
    const CLIENT_ID = MQTT_CONFIG.clientIdPrefix + Math.random().toString(16).substr(2, 6);
    const TOPIC_CMD = 'locker/locker001/cmd';
    const TOPIC_REPLY = 'locker/locker001/reply';
    const BOX_COUNT = 12;

    // ========== 状态 ==========
    let lockStates = {};
    let mqttConnected = false;
    let client = null;

    // ========== DOM ==========
    const grid = document.getElementById('gridContainer');
    const connStatus = document.getElementById('connStatus');
    const toast = document.getElementById('toast');

    // ========== Toast ==========
    function showToast(msg, duration = 2000) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    // ========== 连接状态 ==========
    function updateConnStatus(online) {
        connStatus.textContent = online ? '已连接' : '已断开';
        connStatus.className = 'status-badge ' + (online ? 'online' : 'offline');
        mqttConnected = online;
        document.querySelectorAll('.btn').forEach(btn => btn.disabled = !online);
    }

    // ========== 渲染卡片 ==========
    function renderCards() {
        let html = '';
        for (let i = 1; i <= BOX_COUNT; i++) {
            const state = lockStates[i] || 'unknown';
            const stateText = state === 'open' ? '开' : (state === 'closed' ? '关' : '未知');
            const stateClass = state === 'open' ? 'open' : (state === 'closed' ? 'closed' : 'unknown');
            html += `
                <div class="card" id="card-${i}">
                    <div class="id">#${String(i).padStart(2, '0')}</div>
                    <div class="state ${stateClass}" id="state-${i}">${stateText}</div>
                    <div class="btn-group">
                        <button class="btn btn-open" data-box="${i}" data-action="open">开锁</button>
                        <button class="btn btn-refresh" data-box="${i}" data-action="status">查询</button>
                    </div>
                </div>
            `;
        }
        grid.innerHTML = html;
        // 事件委托
        grid.addEventListener('click', function(e) {
            const btn = e.target.closest('.btn');
            if (!btn || btn.disabled) return;
            const box = parseInt(btn.dataset.box);
            const action = btn.dataset.action;
            if (action === 'open') sendCommand('open', box);
            else if (action === 'status') sendCommand('status', box);
        });
        document.querySelectorAll('.btn').forEach(btn => btn.disabled = !mqttConnected);
    }

    // ========== 更新单个锁状态 ==========
    function updateLockState(box, state) {
        if (state !== 'open' && state !== 'closed') state = 'unknown';
        lockStates[box] = state;
        const stateEl = document.getElementById(`state-${box}`);
        if (stateEl) {
            stateEl.textContent = state === 'open' ? '开' : (state === 'closed' ? '关' : '未知');
            stateEl.className = 'state ' + state;
        }
    }

    // ========== 发送命令 ==========
    function sendCommand(cmd, box) {
        if (!mqttConnected) {
            showToast('⚠️ 未连接', 1500);
            return;
        }
        const payload = JSON.stringify({ cmd, box, ts: Date.now() });
        const message = new Paho.MQTT.Message(payload);
        message.destinationName = TOPIC_CMD;
        message.qos = 1;
        client.send(message);
        showToast(`📤 已发送 ${cmd} ${box}`, 1000);
    }

    // ========== 查询所有锁状态（依次） ==========
    function queryAllStatus() {
        if (!mqttConnected) {
            showToast('⚠️ 未连接', 1500);
            return;
        }
        showToast('🔄 查询全部锁状态...', 2000);
        for (let i = 1; i <= BOX_COUNT; i++) {
            setTimeout(() => sendCommand('status', i), i * 200);
        }
    }

    // ========== MQTT 回调 ==========
    client = new Paho.MQTT.Client(BROKER_HOST, WS_PORT, CLIENT_ID);

    client.onConnectionLost = function(responseObject) {
        updateConnStatus(false);
        showToast('🔴 连接断开', 2000);
        setTimeout(() => {
            if (!mqttConnected) connectMqtt();
        }, 10000);
    };

    client.onMessageArrived = function(message) {
        const topic = message.destinationName;
        if (topic === TOPIC_REPLY) {
            try {
                const data = JSON.parse(message.payloadString);
                console.log('[Reply]', data);
                if (data.code !== 0) {
                    showToast(`❌ 失败: ${data.msg}`, 2000);
                    return;
                }
                if (data.box !== undefined && data.box >= 1 && data.box <= 12) {
                    if (data.data && data.data.status !== undefined) {
                        const statusText = data.data.status === 1 ? 'open' : 'closed';
                        updateLockState(data.box, statusText);
                        showToast(`🔒 #${String(data.box).padStart(2,'0')} ${statusText === 'open' ? '开' : '关'}`, 1000);
                    } else if (data.msg === 'success' && !data.data) {
                        // open 成功，稍后查询状态
                        showToast(`✅ #${String(data.box).padStart(2,'0')} 开锁成功`, 1500);
                        setTimeout(() => sendCommand('status', data.box), 600);
                    }
                }
            } catch (e) {
                console.warn('Parse reply error:', e);
            }
        } else if (topic === 'locker/locker001/event') {
            try {
                const data = JSON.parse(message.payloadString);
                if (data.event === 'heartbeat' && data.boxes) {
                    data.boxes.forEach(item => {
                        updateLockState(item.id, item.status === 1 ? 'open' : 'closed');
                    });
                    showToast('✅ 状态已同步', 1000);
                }
            } catch (e) {
                console.warn('Parse event error:', e);
            }
        }
    };

    // ========== 连接 MQTT ==========
    function connectMqtt() {
        const options = {
            userName: USERNAME,
            password: PASSWORD,
            useSSL: (WS_PORT === 8084 || WS_PORT === 8884),
            timeout: 5,
            onSuccess: function() {
                updateConnStatus(true);
                showToast('✅ MQTT 连接成功', 1500);
                client.subscribe(TOPIC_REPLY, { qos: 1 });
                client.subscribe('locker/locker001/event', { qos: 1 });
                setTimeout(queryAllStatus, 500);
            },
            onFailure: function(err) {
                updateConnStatus(false);
                showToast(`❌ 连接失败: ${err.errorMessage || '未知'}`, 3000);
                setTimeout(connectMqtt, 10000);
            }
        };
        client.connect(options);
    }

    // ========== 启动 ==========
    renderCards();
    connectMqtt();

    // 添加“刷新全部”按钮
    const headerRight = document.querySelector('.header');
    const refreshBtn = document.createElement('button');
    refreshBtn.textContent = '🔄 刷新';
    refreshBtn.className = 'btn btn-refresh';
    refreshBtn.style.padding = '4px 12px';
    refreshBtn.style.fontSize = '13px';
    refreshBtn.onclick = queryAllStatus;
    headerRight.appendChild(refreshBtn);

    // 调试
    window.debug = { client, sendCommand, queryAllStatus, lockStates };
</script>

</body>
</html>
